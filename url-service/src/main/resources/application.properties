spring.application.name=urlshortener-url-service
server.port=8081

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/urldb}
spring.datasource.username=${DB_USER:urluser}
spring.datasource.password=${DB_PASSWORD:urlpass}

# Flyway owns the schema; Hibernate only checks that it matches the entities
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
